name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26.8.1'

      - name: Run semantic-release
        id: semantic_release      
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run format-check
          npm run build
          npm run test
          npx semantic-release

      - name: Publish Cloud Copilot package alias
        if: steps.semantic_release.outputs.changed == 'true'
        uses: act-security-labs/dual-npm-publish-action@0af853d1d5705e464a5806bc0c9f9641e3b2c292
        with:
          package-name: '@cloud-copilot/iam-lens'
          version: ${{ steps.semantic_release.outputs.version }}